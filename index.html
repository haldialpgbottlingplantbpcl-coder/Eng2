<script>
'use strict';

// ═══════════════════ UTILITIES ═══════════════════
const $ = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>[...c.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n)=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}).format(Number(n)||0);
const fmtCur = (n)=>'₹'+fmt(n);
const dt = (ts)=>ts?new Date(ts).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';
const today = ()=>new Date().toISOString().slice(0,10);
const simpleHash = (s)=>{let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return h.toString(36);};

// ═══════════════════ STORAGE ═══════════════════
const DB = {
  get(k,d=[]){try{const v=localStorage.getItem('hss_'+k);return v?JSON.parse(v):d;}catch{return d;}},
  set(k,v){localStorage.setItem('hss_'+k,JSON.stringify(v));},
  del(k){localStorage.removeItem('hss_'+k);},
  keys(){return Object.keys(localStorage).filter(k=>k.startsWith('hss_')).map(k=>k.slice(4));}
};

// ═══════════════════ STATE ═══════════════════
const State = {
  user:null, view:'dashboard', params:{},
  dark: localStorage.getItem('hss_dark')==='1',
  sidebarOpen: window.innerWidth>900
};

// ═══════════════════ DATA ACCESSORS ═══════════════════
const Data = {
  users:()=>DB.get('users',[]), saveUsers:(v)=>DB.set('users',v),
  materials:()=>DB.get('materials',[]), saveMaterials:(v)=>DB.set('materials',v),
  ledger:()=>DB.get('ledger',[]), saveLedger:(v)=>DB.set('ledger',v),
  requests:()=>DB.get('requests',[]), saveRequests:(v)=>DB.set('requests',v),
  notifications:()=>DB.get('notifications',[]), saveNotifications:(v)=>DB.set('notifications',v),
  audit:()=>DB.get('audit',[]), saveAudit:(v)=>DB.set('audit',v),
  settings:()=>DB.get('settings',{}), saveSettings:(v)=>DB.set('settings',v),
  categories:()=>{
    const def = [
      ['mechanical','Mechanical Spares','MEC'],['electrical','Electrical Spares','ELE'],
      ['instrumentation','Instrumentation','INS'],['fire','Fire Fighting Equipment','FIR'],
      ['safety','Safety Equipment','SAF'],['tools','Tools and Tackles','TOO'],
      ['pumps','Pumps and Motors','PUM'],['valves','Valves and Fittings','VAL'],
      ['bearings','Bearings','BEA'],['pipes','Pipes and Hoses','PIP'],
      ['lpg','LPG Filling Equipment Spares','LPG'],['dpr','DPR and SC Valve Spares','DPR'],
      ['cvt','CVT Equipment','CVT'],['office','Office Consumables','OFF'],
      ['general','General Consumables','GEN'],['other','Other Materials','OTH']
    ].map(([id,name,code])=>({id,name,code}));
    return DB.get('categories',def);
  },
  saveCategories:(v)=>DB.set('categories',v)
};

// ═══════════════════ ROLES & PERMISSIONS ═══════════════════
const ROLE_PERMS = {
  super_admin:['*'],
  store_admin:['materials.read','materials.write','receipts.create','issues.create','returns.create','requests.read.all','requests.approve','users.read','reports.read','ledger.read','settings.read'],
  storekeeper:['materials.read','materials.write','receipts.create','issues.create','returns.create','requests.read.all','reports.read','ledger.read'],
  engineering_officer:['materials.read','requests.read.all','requests.approve','reports.read','ledger.read','requests.create'],
  technician:['materials.read','requests.create','ledger.read'],
  auditor:['materials.read','reports.read','ledger.read','users.read'],
  read_only:['materials.read','reports.read']
};
const ROLE_NAMES = {
  super_admin:'Super Admin', store_admin:'Store Admin', storekeeper:'Storekeeper',
  engineering_officer:'Engineering Officer', technician:'Maintenance Technician',
  auditor:'Auditor', read_only:'Read-Only User'
};
function can(perm){
  if(!State.user) return false;
  const perms = State.user.permissions || [];
  return perms.includes('*') || perms.includes(perm);
}

// ═══════════════════ AUDIT + NOTIFICATIONS ═══════════════════
const Audit = {
  log(userId, action, target, detail){
    const logs = Data.audit();
    logs.unshift({id:uid(),userId,action,target,detail,at:Date.now()});
    Data.saveAudit(logs.slice(0,1000));
  }
};
const Notify = {
  create(userId,type,title,body){
    const n = Data.notifications();
    n.unshift({id:uid(),userId,type,title,body,read:false,at:Date.now()});
    Data.saveNotifications(n.slice(0,500));
  },
  unreadCount(){
    return Data.notifications().filter(x=>x.userId===(State.user?.uid??'_')&&!x.read).length;
  }
};

// ═══════════════════ STOCK ENGINE ═══════════════════
const SIGN = {'receipt':+1,'issue':-1,'return-good':+1,'return-damaged':0,'return-scrap':0,'adjustment':1,'reversal':1,'transfer-in':+1,'transfer-out':-1};
function commitStock({type,materialId,qty,metadata={},refTxnId=null,reason=null}){
  if(!State.user) throw new Error('Not authenticated');
  const mats = Data.materials();
  const mat = mats.find(m=>m.id===materialId);
  if(!mat) throw new Error('Material not found');
  if(mat.status!=='active') throw new Error('Material not active');
  let delta = SIGN[type]*Math.abs(qty);
  if(type==='reversal'){
    const orig = Data.ledger().find(x=>x.id===refTxnId);
    if(!orig) throw new Error('Original transaction not found');
    delta = -orig.qtyDelta;
  }
  if(type==='adjustment') delta = Number(qty);
  const newBalance = mat.currentStock + delta;
  if(newBalance<0) throw new Error(`Insufficient stock. Available: ${mat.currentStock}`);
  const txnId = 'TXN-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
  const entry = {id:txnId,type,materialId,materialName:mat.name,qtyDelta:delta,balanceAfter:newBalance,refTxnId,reason,...metadata,userId:State.user.uid,userName:State.user.fullName,createdAt:Date.now()};
  const ledger = Data.ledger(); ledger.unshift(entry); Data.saveLedger(ledger);
  mat.currentStock = newBalance; mat.updatedAt = Date.now(); mat.updatedBy = State.user.uid;
  Data.saveMaterials(mats);
  if(newBalance<=mat.minStock && type!=='reversal'){
    Data.users().filter(u=>['super_admin','store_admin'].includes(u.role)&&u.status==='active')
      .forEach(a=>Notify.create(a.uid,'low-stock',`Low stock: ${mat.name}`,`Balance ${newBalance} ${mat.uom} ≤ min ${mat.minStock}`));
  }
  Audit.log(State.user.uid,'STOCK_'+type.toUpperCase(),{txnId,materialId,qty:delta},{balanceAfter:newBalance});
  return entry;
}

// ═══════════════════ TOAST ═══════════════════
function toast(msg,kind='info'){
  const colors = {info:'#0D9488',success:'#059669',error:'#DC2626',warn:'#D97706',warning:'#D97706'};
  const t = document.createElement('div');
  t.className='notif-toast'; t.style.background = colors[kind]||colors.info; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},3000);
}

// ═══════════════════ AUTH ═══════════════════
const Auth = {
  async login(ident,password){
    const users = Data.users();
    const u = users.find(x=>
      (x.email?.toLowerCase()===ident.toLowerCase()||
       x.username?.toLowerCase()===ident.toLowerCase()||
       x.employeeId?.toLowerCase()===ident.toLowerCase()) &&
      x.passwordHash===simpleHash(password));
    if(!u) throw new Error('Invalid credentials');
    if(u.status==='pending') throw new Error('Account pending admin approval');
    if(u.status==='suspended'||u.status==='disabled') throw new Error('Account '+u.status);
    u.lastLoginAt = Date.now(); Data.saveUsers(users);
    Audit.log(u.uid,'LOGIN',null,{});
    State.user = u;
    sessionStorage.setItem('hss_session',u.uid);
    return u;
  },
  logout(){
    if(State.user) Audit.log(State.user.uid,'LOGOUT',null,{});
    State.user = null; sessionStorage.removeItem('hss_session');
    State.view='dashboard'; render();
  },
  restore(){
    const id = sessionStorage.getItem('hss_session');
    if(!id) return;
    const u = Data.users().find(x=>x.uid===id);
    if(u&&u.status==='active') State.user=u;
  },
  register(data){
    const users = Data.users();
    if(users.some(x=>x.email?.toLowerCase()===data.email.toLowerCase())) throw new Error('Email already exists');
    if(users.some(x=>x.username?.toLowerCase()===data.username.toLowerCase())) throw new Error('Username taken');
    if(users.some(x=>x.employeeId?.toLowerCase()===data.employeeId.toLowerCase())) throw new Error('Employee ID already exists');
    const u = {
      uid:uid(),fullName:data.fullName,employeeId:data.employeeId,
      designation:data.designation,department:data.department,mobile:data.mobile,
      email:data.email,username:data.username,passwordHash:simpleHash(data.password),
      role:'technician',status:'pending',permissions:ROLE_PERMS.technician,
      createdAt:Date.now(),lastLoginAt:null
    };
    users.push(u); Data.saveUsers(users);
    Audit.log(u.uid,'REGISTER',{email:u.email},{});
    Data.users().filter(x=>x.role==='super_admin'&&x.status==='active')
      .forEach(a=>Notify.create(a.uid,'user-registration','New Registration',`${data.fullName} (${data.employeeId}) requested access`));
    return u;
  }
};

function renderDashboard(){
  const mats = Data.materials().filter(m=>m.status==='active');
  const totalStock = mats.reduce((a,m)=>a+(m.currentStock||0),0);
  const lowStock = mats.filter(m=>m.currentStock>0&&m.currentStock<=m.minStock).length;
  const outOfStock = mats.filter(m=>m.currentStock===0).length;
  const stockValue = mats.reduce((a,m)=>a+(m.currentStock||0)*(m.unitPrice||0),0);
  const cats = new Set(mats.map(m=>m.categoryId)).size;
  const ledger = Data.ledger();
  const issued = ledger.filter(l=>l.type==='issue').reduce((a,l)=>a+Math.abs(l.qtyDelta),0);
  const recent = ledger.slice(0,8);
  const cards = [
    {label:'Total Materials',value:mats.length,icon:'📦'},
    {label:'Total Stock',value:fmt(totalStock),icon:'🗃️'},
    {label:'Issued (All Time)',value:fmt(issued),icon:'📤'},
    {label:'Low Stock',value:lowStock,icon:'⚠️'},
    {label:'Out of Stock',value:outOfStock,icon:'🚨'},
    {label:'Categories',value:cats,icon:'🏷️'},

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-6">
    ${cards.map(c=>`<div class="card"><div class="text-3xl mb-2">${c.icon}</div><div class="text-xs font-semibold text-steel-500 uppercase">${c.label}</div><div class="text-2xl font-bold text-navy-900 dark:text-white mt-1">${c.value}</div></div>`).join('')}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
    <div class="card"><h3 class="font-bold mb-3 text-navy-900 dark:text-white">Category-wise Stock</h3><div style="height:220px"><canvas id="catChart"></canvas></div></div>
    <div class="card"><h3 class="font-bold mb-3 text-navy-900 dark:text-white">Monthly Stock Movement</h3><div style="height:220px"><canvas id="movChart"></canvas></div></div>
  </div>
  <div class="card">
    <h3 class="font-bold mb-3 text-navy-900 dark:text-white">Recent Transactions</h3>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs text-steel-500 uppercase border-b"><th class="py-2">Date</th><th>Type</th><th>Material</th><th class="text-right">Δ</th><th class="text-right">Balance</th><th>User</th></tr></thead>
        <tbody>
          ${recent.length?recent.map(l=>`<tr class="border-b border-steel-100 dark:border-navy-700"><td class="py-2 text-xs">${dt(l.createdAt)}</td><td><span class="badge badge-${l.qtyDelta>0?'green':l.qtyDelta<0?'red':'gray'}">${esc(l.type)}</span></td><td>${esc(l.materialName||'—')}</td><td class="text-right font-semibold ${l.qtyDelta>0?'text-green-600':l.qtyDelta<0?'text-red-600':''}">${l.qtyDelta>0?'+':''}${l.qtyDelta}</td><td class="text-right">${l.balanceAfter}</td><td class="text-xs">${esc(l.userName||'')}</td></tr>`).join(''):`<tr><td colspan="6" class="py-4 text-center text-steel-500">No transactions yet</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}
function bindDashboard(){
  const mats = Data.materials().filter(m=>m.status==='active');
  const catMap = {};
  mats.forEach(m=>{const k = m.categoryName || Data.categories().find(c=>c.id===m.categoryId)?.name || 'Other'; catMap[k]=(catMap[k]||0)+(m.currentStock||0);});
  const catCtx = $('#catChart');
  if(catCtx&&window.Chart) new Chart(catCtx,{type:'doughnut',data:{labels:Object.keys(catMap),datasets:[{data:Object.values(catMap),backgroundColor:['#0D9488','#14B8A6','#2DD4BF','#0F766E','#115E59','#5EEAD4','#99F6E4','#134E4A']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:10}}}}}});
  const ledger = Data.ledger();
  const months = [];
  for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push({label:d.toLocaleString('en',{month:'short'}),key:d.getFullYear()+'-'+d.getMonth()});}
  const inData = months.map(mo=>ledger.filter(l=>{const d=new Date(l.createdAt);return d.getFullYear()+'-'+d.getMonth()===mo.key&&l.qtyDelta>0;}).reduce((a,l)=>a+l.qtyDelta,0));
  const outData = months.map(mo=>ledger.filter(l=>{const d=new Date(l.createdAt);return d.getFullYear()+'-'+d.getMonth()===mo.key&&l.qtyDelta<0;}).reduce((a,l)=>a+Math.abs(l.qtyDelta),0));
  const movCtx = $('#movChart');
  if(movCtx&&window.Chart) new Chart(movCtx,{type:'bar',data:{labels:months.map(m=>m.label),datasets:[{label:'Received',data:inData,backgroundColor:'#0D9488'},{label:'Issued',data:outData,backgroundColor:'#DC2626'}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true}},plugins:{legend:{labels:{boxWidth:12,font:{size:10}}}}}});
}

function openTxnModal(action,materialId){
  const mat = Data.materials().find(m=>m.id===materialId);
  const labels = {receive:'Receive Material',issue:'Issue Material',return:'Return Material',request:'Request Material'};
  const body = {
    receive:`<label class="label">Qty Received</label><input id="txQty" class="input" type="number" min="1" value="1" required>
      <label class="label mt-2">Supplier</label><input id="txSupplier" class="input" placeholder="Supplier name">
      <label class="label mt-2">PO/Invoice No.</label><input id="txRef" class="input">`,
    issue:`<label class="label">Qty to Issue (max ${mat.currentStock})</label><input id="txQty" class="input" type="number" min="1" max="${mat.currentStock}" value="1" required>
      <label class="label mt-2">Department</label><input id="txDept" class="input" value="Engineering">
      <label class="label mt-2">Purpose</label><input id="txPurpose" class="input" placeholder="Work order / job purpose">`,
    return:`<label class="label">Qty to Return</label><input id="txQty" class="input" type="number" min="1" value="1" required>
      <label class="label mt-2">Condition</label><select id="txCondition" class="input">
        <option value="return-good">Good / Reusable (adds to stock)</option>
        <option value="return-damaged">Damaged (does NOT add)</option>
        <option value="return-scrap">Scrap / Rejected (does NOT add)</option></select>
      <label class="label mt-2">Reason</label><input id="txReason" class="input">`,
    request:`<label class="label">Qty Required</label><input id="txQty" class="input" type="number" min="1" value="1" required>
      <label class="label mt-2">Purpose</label><input id="txPurpose" class="input" required>
      <label class="label mt-2">Work Order / Equipment</label><input id="txWorkOrder" class="input">`
  }[action];
  const c = $('#modalContainer');
  c.innerHTML = `
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" id="modalOverlay">
      <div class="bg-white dark:bg-navy-800 rounded-xl p-6 max-w-md w-full">
        <h3 class="text-xl font-bold mb-2 text-navy-900 dark:text-white">${labels[action]}</h3>
        <p class="text-sm text-steel-500 mb-3">${esc(mat.name)} — ${mat.currentStock} ${mat.uom} available</p>
        ${body}
        <div class="flex gap-2 mt-4">
          <button class="btn btn-primary flex-1" id="txConfirm">Confirm</button>
          <button class="btn btn-secondary" id="txCancel">Cancel</button>
        </div>
      </div>
    </div>`;
  $('#txCancel').addEventListener('click',()=>c.innerHTML='');
  $('#modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')c.innerHTML='';});
  $('#txConfirm').addEventListener('click',()=>{
    try{
      const qty = Number($('#txQty').value);
      if(!qty||qty<=0) throw new Error('Quantity must be positive');
      if(action==='request'){
        const reqs = Data.requests();
        reqs.unshift({id:uid(),requesterId:State.user.uid,requesterName:State.user.fullName,materialId:mat.id,materialName:mat.name,qty,purpose:$('#txPurpose').value,workOrder:$('#txWorkOrder').value,status:'pending',createdAt:Date.now(),approvals:[]});
        Data.saveRequests(reqs);
        Data.users().filter(u=>['super_admin','store_admin','engineering_officer'].includes(u.role)&&u.status==='active')
          .forEach(a=>Notify.create(a.uid,'request','New Request',`${State.user.fullName} requested ${qty} ${mat.uom} of ${mat.name}`));
        toast('Request submitted','success');
      } else {
        const type = action==='receive'?'receipt':action==='issue'?'issue':$('#txCondition').value;
        const meta = {};
        if(action==='receive'){meta.supplierName=$('#txSupplier').value;meta.refNo=$('#txRef').value;}
        if(action==='issue'){meta.department=$('#txDept').value;meta.purpose=$('#txPurpose').value;}
        if(action==='return'){meta.reason=$('#txReason').value;}
        commitStock({type,materialId:mat.id,qty,metadata:meta});
        toast(labels[action]+' successful','success');
      }
      c.innerHTML='';
      render();
    }catch(err){toast(err.message,'error');}
  });
}

function renderScan(){
  return `
  <h1 class="text-2xl font-bold text-navy-900 dark:text-white mb-4">QR Code Scanner</h1>
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="card">
      <h3 class="font-bold mb-3">Camera Scan</h3>
      <div id="qr-reader"></div>
      <p class="text-xs text-steel-500 mt-2">Point your camera at a material QR code</p>
    </div>
    <div class="card">
      <h3 class="font-bold mb-3">Manual Entry</h3>
      <label class="label">Material ID</label>
      <input id="manualId" class="input mb-2" placeholder="HSS-MEC-2024-00001">
      <button class="btn btn-primary" id="manualOpen">Open Material</button>
      <p class="text-xs text-steel-500 mt-4">Or use a USB barcode scanner — it types into the field above.</p>
    </div>
  </div>`;
}
function bindScan(){
  const openId = (id)=>{
    id = (id||'').trim();
    if(!id) return;
    const mat = Data.materials().find(m=>m.id===id);
    if(!mat) return toast('Material not found: '+id,'error');
    if(window.__qrScanner){try{window.__qrScanner.stop().catch(()=>{});}catch(e){}window.__qrScanner=null;}
    State.params={id}; State.view='material-view'; render();
  };
  $('#manualOpen').addEventListener('click',()=>openId($('#manualId').value));
  $('#manualId').addEventListener('keydown',e=>{if(e.key==='Enter')openId(e.target.value);});
  if(window.Html5Qrcode){
    try{
      const scanner = new Html5Qrcode('qr-reader');
      window.__qrScanner = scanner;
      scanner.start({facingMode:'environment'},{fps:10,qrbox:250},(text)=>{
        let id = text;
        const m = text.match(/HSS-[A-Z]+-\d{4}-\d+/);
        if(m) id = m[0];
        scanner.stop().then(()=>{window.__qrScanner=null;openId(id);}).catch(()=>openId(id));
      },()=>{}).catch(err=>{
        const el = $('#qr-reader');
        if(el) el.innerHTML = `<p class="text-sm text-red-600">Camera unavailable: ${esc(err.message||err)}</p><p class="text-xs text-steel-500 mt-1">Use manual entry →</p>`;
      });
    }catch(e){console.error(e);}
  }
}

function buildReportData(key){
  const mats = Data.materials();
  const ledger = Data.ledger();
  switch(key){
    case 'stock': return {title:'Current Stock Report',cols:['Material ID','Name','Category','Stock','UOM','Min','Unit Price','Value'],rows:mats.map(m=>[m.id,m.name,m.categoryName||m.categoryId,m.currentStock,m.uom,m.minStock,m.unitPrice,m.currentStock*m.unitPrice])};
    case 'ledger': return {title:'Transaction Ledger',cols:['Txn ID','Date','Type','Material','Δ','Balance','User'],rows:ledger.map(l=>[l.id,new Date(l.createdAt).toLocaleString(),l.type,l.materialName,l.qtyDelta,l.balanceAfter,l.userName])};
    case 'receipts': return {title:'Receipt Register',cols:['Txn ID','Date','Material','Qty','Supplier','User'],rows:ledger.filter(l=>l.type==='receipt').map(l=>[l.id,new Date(l.createdAt).toLocaleString(),l.materialName,l.qtyDelta,l.supplierName||'',l.userName])};
    case 'issues': return {title:'Issue Register',cols:['Txn ID','Date','Material','Qty','Dept','User'],rows:ledger.filter(l=>l.type==='issue').map(l=>[l.id,new Date(l.createdAt).toLocaleString(),l.materialName,Math.abs(l.qtyDelta),l.department||'',l.userName])};
    case 'returns': return {title:'Return Register',cols:['Txn ID','Date','Material','Type','Qty','User'],rows:ledger.filter(l=>l.type.startsWith('return-')).map(l=>[l.id,new Date(l.createdAt).toLocaleString(),l.materialName,l.type,Math.abs(l.qtyDelta),l.userName])};
    case 'low': return {title:'Low Stock Report',cols:['Material ID','Name','Stock','Min','UOM'],rows:mats.filter(m=>m.currentStock>0&&m.currentStock<=m.minStock).map(m=>[m.id,m.name,m.currentStock,m.minStock,m.uom])};
    case 'out': return {title:'Out of Stock Report',cols:['Material ID','Name','Min','UOM'],rows:mats.filter(m=>m.currentStock===0).map(m=>[m.id,m.name,m.minStock,m.uom])};
    case 'users': return {title:'User Activity',cols:['Name','Employee ID','Role','Status','Email','Last Login'],rows:Data.users().map(u=>[u.fullName,u.employeeId,ROLE_NAMES[u.role],u.status,u.email,u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'Never'])};
    case 'audit': return {title:'Audit Trail',cols:['Date','User','Action','Target'],rows:Data.audit().map(a=>[new Date(a.at).toLocaleString(),a.userId,a.action,JSON.stringify(a.target||{})])};
  }
}
function exportCSV(key){
  const r = buildReportData(key);
  const csv = [r.cols,...r.rows].map(row=>row.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(csv,r.title.replace(/\s+/g,'_')+'.csv','text/csv');
}
function exportXLSX(key){
  const r = buildReportData(key);
  const ws = XLSX.utils.aoa_to_sheet([r.cols,...r.rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,r.title.slice(0,30));
  XLSX.writeFile(wb,r.title.replace(/\s+/g,'_')+'.xlsx');
}
function exportPDF(key){
  const r = buildReportData(key);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF('l','pt');
  doc.setFontSize(14); doc.text('Haldia LPG Bottling Plant',40,40);
  doc.setFontSize(10); doc.text(r.title+' — '+new Date().toLocaleString(),40,58);
  doc.autoTable({head:[r.cols],body:r.rows.map(row=>row.map(c=>String(c??''))),startY:75,styles:{fontSize:8},headStyles:{fillColor:[13,148,136]}});
  doc.save(r.title.replace(/\s+/g,'_')+'.pdf');
}
function downloadBlob(content,filename,type){
  const blob = new Blob([content],{type});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

    <div class="card">
      <h3 class="font-bold mb-3 text-navy-900 dark:text-white">Branding</h3>
      <label class="label">Plant Name</label><input class="input mb-2" id="setPlantName" value="${esc(s.plantName||'Haldia LPG Bottling Plant')}">
      <label class="label">App Title</label><input class="input mb-2" id="setAppTitle" value="${esc(s.appTitle||'Haldia Smart Store')}">
      <button class="btn btn-primary" id="saveBranding">Save Branding</button>
    </div>
    <div class="card">
      <h3 class="font-bold mb-3 text-navy-900 dark:text-white">Backup & Restore</h3>
      <p class="text-xs text-steel-500 mb-3">Export all data as JSON — keep this file safe.</p>
      <button class="btn btn-primary mb-2 w-full" id="exportBackup">📥 Download Backup (JSON)</button>
      <label class="btn btn-secondary w-full cursor-pointer">📤 Restore from Backup<input type="file" id="importBackup" accept=".json" class="hidden"></label>
    </div>
    <div class="card">
      <h3 class="font-bold mb-3 text-red-600">Danger Zone</h3>
      <p class="text-xs text-steel-500 mb-3">Deletes ALL data. Cannot be undone.</p>
      <button class="btn btn-danger" id="wipeData">🗑️ Wipe All Data</button>
    </div>
    <div class="card">
      <h3 class="font-bold mb-3 text-navy-900 dark:text-white">System Info</h3>
      <div class="text-sm space-y-1">
        <div>Users: <b>${Data.users().length}</b></div>
        <div>Materials: <b>${Data.materials().length}</b></div>
        <div>Ledger entries: <b>${Data.ledger().length}</b></div>
        <div>Audit logs: <b>${Data.audit().length}</b></div>
        <div class="text-xs text-steel-500 mt-2">Storage used: ~${Math.round(JSON.stringify(localStorage).length/1024)} KB</div>
      </div>
    </div>
  </div>`;
}

// ═══════════════════ BINDERS ═══════════════════
function bindView(view){
  $$('[data-nav]').forEach(b=>{if(!b.dataset.bound){b.dataset.bound='1';b.addEventListener('click',()=>navigate(b.dataset.nav));}});
  if(view==='dashboard') bindDashboard();
  if(view==='materials'){
    $$('[data-material]').forEach(b=>b.addEventListener('click',()=>{State.view='material-view';State.params={id:b.dataset.material};render();}));
    const fs = $('#filterSelect');
    if(fs) fs.addEventListener('change',()=>{State.params={...State.params,filter:fs.value};render();});
  }
  if(view==='material-add'){
    const form = $('#addMaterialForm');
    if(form) form.addEventListener('submit',e=>{
      e.preventDefault();
      try{
        const d = Object.fromEntries(new FormData(form));
        const mats = Data.materials();
        const cat = Data.categories().find(c=>c.id===d.categoryId);
        const year = new Date().getFullYear();
        const seq = mats.filter(m=>m.categoryId===d.categoryId&&m.id?.includes(`-${year}-`)).length+1;
        const id = `HSS-${cat.code}-${year}-${String(seq).padStart(5,'0')}`;
        const openingStock = Number(d.openingStock)||0;
        const mat = {id,name:d.name,description:d.description,categoryId:d.categoryId,categoryName:cat.name,uom:d.uom,minStock:Number(d.minStock),maxStock:Number(d.maxStock),openingStock,currentStock:openingStock,unitPrice:Number(d.unitPrice),location:{rack:d.rack,shelf:d.shelf,bin:d.bin},manufacturer:d.manufacturer,partNumber:d.partNumber,status:'active',enteredBy:State.user.uid,enteredAt:Date.now(),updatedAt:Date.now(),updatedBy:State.user.uid};
        mats.push(mat); Data.saveMaterials(mats);
        if(openingStock>0) commitStock({type:'receipt',materialId:id,qty:openingStock,metadata:{reason:'Opening stock'}});
        Audit.log(State.user.uid,'MATERIAL_CREATE',{id},{name:d.name});
        toast(`Material created: ${id}`,'success');
        State.view='material-view'; State.params={id}; render();
      }catch(err){toast(err.message,'error');}
    });
  }
  if(view==='material-view') bindMaterialView();
  if(view==='scan') bindScan();
  if(['receipts','issues','returns'].includes(view)){
    $$('[data-view-material]').forEach(b=>b.addEventListener('click',()=>{State.view='material-view';State.params={id:b.dataset.viewMaterial};render();}));
  }
  if(view==='requests'){
    $$('[data-approve]').forEach(b=>b.addEventListener('click',()=>{
      const reqs = Data.requests(); const r = reqs.find(x=>x.id===b.dataset.approve);
      if(!r) return;
      r.status='approved'; r.approvals.push({level:1,approverId:State.user.uid,at:Date.now(),action:'approved'});
      Data.saveRequests(reqs);
      Notify.create(r.requesterId,'request','Request Approved',`Your request for ${r.materialName} was approved`);
      toast('Request approved','success'); render();
    }));
    $$('[data-reject]').forEach(b=>b.addEventListener('click',()=>{
      const reqs = Data.requests(); const r = reqs.find(x=>x.id===b.dataset.reject);
      if(!r) return;
      r.status='rejected'; r.approvals.push({level:1,approverId:State.user.uid,at:Date.now(),action:'rejected'});
      Data.saveRequests(reqs);
      Notify.create(r.requesterId,'request','Request Rejected',`Your request for ${r.materialName} was rejected`);
      toast('Request rejected','warning'); render();
    }));
    $$('[data-issue-request]').forEach(b=>b.addEventListener('click',()=>{
      const reqs = Data.requests(); const r = reqs.find(x=>x.id===b.dataset.issueRequest);
      if(!r) return;
      try{
        commitStock({type:'issue',materialId:r.materialId,qty:r.qty,metadata:{purpose:r.purpose,department:r.department||'Engineering'}});
        r.status='issued'; Data.saveRequests(reqs);
        toast('Material issued','success'); render();
      }catch(err){toast(err.message,'error');}
    }));
  }
  if(view==='reports'){
    $$('[data-report]').forEach(b=>b.addEventListener('click',()=>{
      try{
        const {report,format} = b.dataset;
        if(format==='csv') exportCSV(report);
        if(format==='xlsx') exportXLSX(report);
        if(format==='pdf') exportPDF(report);
        toast('Report exported','success');
      }catch(err){toast(err.message,'error');}
    }));
  }
  if(view==='users'){
    $$('[data-approve-user]').forEach(b=>b.addEventListener('click',()=>{
      const uid2 = b.dataset.approveUser; const role = $(`[data-role-for="${uid2}"]`).value;
      const users = Data.users(); const u = users.find(x=>x.uid===uid2);
      if(!u) return;
      u.status='active'; u.role=role; u.permissions=ROLE_PERMS[role]||['materials.read'];
      Data.saveUsers(users);
      Notify.create(uid2,'user-approved','Account Activated','Your account has been approved');
      toast(`Approved ${u.fullName} as ${ROLE_NAMES[role]}`,'success'); render();
    }));
    $$('[data-reject-user]').forEach(b=>b.addEventListener('click',()=>{
      const uid2 = b.dataset.rejectUser; const users = Data.users(); const u = users.find(x=>x.uid===uid2);
      if(!u) return; u.status='disabled'; Data.saveUsers(users); toast('User rejected','warning'); render();
    }));
    $$('[data-suspend-user]').forEach(b=>b.addEventListener('click',()=>{
      if(!confirm('Suspend this user?')) return;
      const uid2 = b.dataset.suspendUser; const users = Data.users(); const u = users.find(x=>x.uid===uid2);
      if(!u) return; u.status='suspended'; Data.saveUsers(users); toast('User suspended','warning'); render();
    }));
    $$('[data-reactivate-user]').forEach(b=>b.addEventListener('click',()=>{
      const uid2 = b.dataset.reactivateUser; const users = Data.users(); const u = users.find(x=>x.uid===uid2);
      if(!u) return; u.status='active'; Data.saveUsers(users); toast('User reactivated','success'); render();
    }));
  }
  if(view==='settings'){
    $('#saveBranding').addEventListener('click',()=>{
      const s = Data.settings(); s.plantName=$('#setPlantName').value; s.appTitle=$('#setAppTitle').value; Data.saveSettings(s);
      toast('Branding saved','success');
    });
    $('#exportBackup').addEventListener('click',()=>{
      const data = {}; DB.keys().forEach(k=>{data[k]=DB.get(k);});
      downloadBlob(JSON.stringify(data,null,2),'haldia-smart-store-backup-'+today()+'.json','application/json');
      toast('Backup downloaded','success');
    });
    $('#importBackup').addEventListener('change',e=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!confirm('Restore will overwrite current data. Continue?')) return;
          Object.keys(data).forEach(k=>DB.set(k,data[k]));
          toast('Backup restored. Reloading...','success');
          setTimeout(()=>location.reload(),1000);
        }catch(err){toast('Invalid backup file','error');}
      };
      reader.readAsText(file);
    });
    $('#wipeData').addEventListener('click',()=>{
      if(!confirm('WIPE ALL DATA? This cannot be undone!')) return;
      if(!confirm('Really sure?')) return;
      DB.keys().forEach(k=>DB.del(k));
      localStorage.removeItem('hss_session');
      location.reload();
    });
  }
}

// ═══════════════════ RENDER ═══════════════════
function render(){
  const root = $('#root');
  if(!State.user){
    if(Data.users().length===0){ root.innerHTML = renderSetup(); bindSetup(); }
    else { root.innerHTML = State.view==='register'?renderRegister():renderLogin(); bindLoginRegister(); }
    return;
  }
  root.innerHTML = renderShell(); bindShell();
  const main = $('#mainContent');
  const views = {
    dashboard:renderDashboard, materials:renderMaterials, 'material-add':renderMaterialAdd,
    'material-view':renderMaterialView, scan:renderScan, receipts:renderReceipts,
    issues:renderIssues, returns:renderReturns, requests:renderRequests,
    reports:renderReports, users:renderUsers, settings:renderSettings,
    notifications:renderNotifications, audit:renderAudit
  };
  const fn = views[State.view]||renderDashboard;
  main.innerHTML = `<div class="fade-in">${fn(State.params)}</div>`;
  bindView(State.view);
}

// ═══════════════════ INIT ═══════════════════
function init(){
  if(State.dark) document.documentElement.classList.add('dark');
  Auth.restore();
  render();
}
init();
</script>
</body>
</html>
