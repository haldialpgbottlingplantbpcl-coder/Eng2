/* ---------------- utils ---------------- */
async function sha256(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPwd(pwd, salt) {
  let h = await sha256(salt + ':' + pwd);
  for (let i = 0; i < 3000; i++) h = await sha256(h);
  return h;
}
const makeSalt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');
const genId = (p) => `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`.toUpperCase();
const fmtMoney = (n, cur='INR') => { try { return new Intl.NumberFormat('en-IN',{style:'currency',currency:cur,maximumFractionDigits:0}).format(n||0); } catch { return (cur||'')+' '+(n||0).toFixed(0); } };
const fmtTime = (ts) => ts ? new Date(ts).toLocaleString() : '—';

async function buildQrPayload(materialId) {
  const check = (await sha256(materialId)).slice(0, 8).toUpperCase();
  return `MAT-${materialId}-${check}`;
}
async function verifyQrPayload(payload) {
  const m = payload.match(/^MAT-(.+)-([A-F0-9]{8})$/);
  if (!m) return null;
  const [, id, chk] = m;
  const expected = (await sha256(id)).slice(0, 8).toUpperCase();
  return expected === chk ? id : null;
}

function initFirebase(cfg) {

  if (!firebase.apps.some(a => a.name === '[DEFAULT]')) firebase.initializeApp(cfg);
  fb = { auth: firebase.auth(), db: firebase.firestore(), storage: firebase.storage() };

}

/* ---------------- toasts ---------------- */
let toastPush = null;
function useToasts() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    toastPush = (t) => {
      const id = Math.random().toString(36).slice(2);
      setToasts(x => [...x, { id, ...t }]);
      setTimeout(() => setToasts(x => x.filter(y => y.id !== id)), 4000);
    };
  }, []);
  return toasts;
}
function Toaster({ toasts }) {
  return (
    <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2">
      {toasts.map(t => (
        <div key={t.id} className={`min-w-[260px] rounded-xl border p-3 shadow-xl backdrop-blur bg-slate-900/90 ${t.variant==='error'?'border-red-500/40':t.variant==='success'?'border-emerald-500/40':'border-slate-700'}`}>
          <p className="text-sm font-medium">{t.title}</p>
          {t.description && <p className="text-xs text-slate-400 mt-0.5">{t.description}</p>}
        </div>
      ))}
    </div>
  );
}
const toast = (t) => { if (toastPush) toastPush(t); };

/* ---------------- db operations (atomic) ---------------- */
async function issueMaterial({ materialId, qty, issuedTo, department, purpose, remarks, actor }) {
  const mRef = fb.db.collection('materials').doc(materialId);
  const txnRef = fb.db.collection('transactions').doc();
  const auditRef = fb.db.collection('auditLogs').doc();
  let result;
  await fb.db.runTransaction(async (tx) => {
    const mSnap = await tx.get(mRef);
    if (!mSnap.exists) throw new Error('Material not found');
    const m = mSnap.data();
    if (qty <= 0) throw new Error('Quantity must be positive');
    if (m.quantity < qty) throw new Error(`Insufficient stock (${m.quantity} ${m.uom})`);
    const afterQty = m.quantity - qty;
    const newStatus = afterQty === 0 ? 'out_of_stock' : (afterQty <= m.minStock ? 'low_stock' : 'active');
    result = {
      transactionId: genId('TXN'), type: 'ISSUE', materialId, materialName: m.name,
      qty, beforeQty: m.quantity, afterQty, uom: m.uom,
      issuedTo, department, purpose, remarks,
      date: Date.now(), userId: actor.uid, userName: actor.name, status: 'ACTIVE'
    };
    tx.update(mRef, { quantity: afterQty, status: newStatus, updatedAt: Date.now(), updatedBy: actor.uid });
    tx.set(txnRef, result);
    tx.set(auditRef, { action: 'ISSUE', entity: 'material', entityId: materialId, userId: actor.uid, userName: actor.name, details: `Issued ${qty} ${m.uom} to ${issuedTo}`, timestamp: Date.now() });
  });
  return result;
}
async function receiveMaterial({ materialId, qty, receiptType, supplier, invoiceNo, remarks, actor }) {
  const mRef = fb.db.collection('materials').doc(materialId);
  const txnRef = fb.db.collection('transactions').doc();
  const auditRef = fb.db.collection('auditLogs').doc();
  let result;
  await fb.db.runTransaction(async (tx) => {
    const mSnap = await tx.get(mRef);
    if (!mSnap.exists) throw new Error('Material not found');
    const m = mSnap.data();
    if (qty <= 0) throw new Error('Quantity must be positive');
    const afterQty = m.quantity + qty;
    const newStatus = afterQty <= m.minStock ? 'low_stock' : 'active';
    result = {
      transactionId: genId('TXN'), type: 'RECEIPT', materialId, materialName: m.name,
      qty, beforeQty: m.quantity, afterQty, uom: m.uom,
      supplier, invoiceNo, remarks: `${receiptType}${remarks ? ' · ' + remarks : ''}`,
      date: Date.now(), userId: actor.uid, userName: actor.name, status: 'ACTIVE'
    };
    tx.update(mRef, { quantity: afterQty, status: newStatus, updatedAt: Date.now(), updatedBy: actor.uid });
    tx.set(txnRef, result);
    tx.set(auditRef, { action: 'RECEIPT', entity: 'material', entityId: materialId, userId: actor.uid, userName: actor.name, details: `Received ${qty} ${m.uom} (${receiptType})`, timestamp: Date.now() });
  });
  return result;
}
async function revertTransaction({ txn, reason, actor }) {
  const tRef = fb.db.collection('transactions').doc(txn.id);
  const mRef = fb.db.collection('materials').doc(txn.materialId);
  const auditRef = fb.db.collection('auditLogs').doc();
  await fb.db.runTransaction(async (tx) => {
    const [tSnap, mSnap] = await Promise.all([tx.get(tRef), tx.get(mRef)]);
    if (!tSnap.exists) throw new Error('Transaction not found');
    if (!mSnap.exists) throw new Error('Material not found');
    const t = tSnap.data();
    if (t.status === 'REVERTED') throw new Error('Already reverted');
    const m = mSnap.data();
    const delta = t.type === 'ISSUE' ? t.qty : -t.qty;
    const newQty = m.quantity + delta;
    if (newQty < 0) throw new Error('Revert would cause negative stock');
    tx.update(mRef, { quantity: newQty, status: newQty === 0 ? 'out_of_stock' : (newQty <= m.minStock ? 'low_stock' : 'active'), updatedAt: Date.now(), updatedBy: actor.uid });
    tx.update(tRef, { status: 'REVERTED', revertedBy: actor.uid, revertedAt: Date.now(), revertReason: reason });
    tx.set(auditRef, { action: 'REVERT_TRANSACTION', entity: 'transaction', entityId: txn.id, userId: actor.uid, userName: actor.name, reason, details: `Reverted ${t.type} of ${t.qty} ${m.uom}`, timestamp: Date.now() });
  });
}
async function softDeleteMaterial({ materialId, reason, actor }) {
  const mRef = fb.db.collection('materials').doc(materialId);
  const auditRef = fb.db.collection('auditLogs').doc();
  await fb.db.runTransaction(async (tx) => {
    const s = await tx.get(mRef);
    if (!s.exists) throw new Error('Material not found');
    tx.update(mRef, { isDeleted: true, deletedAt: Date.now(), deletedBy: actor.uid, deleteReason: reason });
    tx.set(auditRef, { action: 'DELETE_MATERIAL', entity: 'material', entityId: materialId, userId: actor.uid, userName: actor.name, reason, timestamp: Date.now() });
  });
}

/* ---------------- Password Gate (destructive actions) ---------------- */
function PasswordGate({ open, onClose, onConfirm, title, confirmLabel="Authorize" }) {
  const [pwd, setPwd] = useState('');
  const [override, setOverride] = useState('');
  const [reason, setReason] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit() {
    if (reason.trim().length < 10) return toast({ title:'Reason must be at least 10 characters', variant:'error' });
    setBusy(true);
    try {
      const u = fb.auth.currentUser;
      if (!u || !u.email) throw new Error('No active user');
      const cred = firebase.auth.EmailAuthProvider.credential(u.email, pwd);
      await u.reauthenticateWithCredential(cred);
      const cfgSnap = await fb.db.collection('system').doc('config').get();
      const cfg = cfgSnap.data() || {};
      const inputHash = await hashPwd(override, cfg.adminOverrideSalt || '');
      if (inputHash !== cfg.adminOverrideHash) throw new Error('Invalid admin override password');
      await onConfirm(reason.trim());
      toast({ title:'Authorized successfully', variant:'success' });
      setPwd(''); setOverride(''); setReason(''); onClose();
    } catch (e) {
      toast({ title:'Authorization failed', description: e.message, variant:'error' });
    } finally { setBusy(false); }
  }

  if (!open) return null;
  return (
    <Modal onClose={onClose} title={title || 'This action requires authorization'}>
      <div className="space-y-3">
        <div><Label>Your password</Label><Input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="Re-enter your account password"/></div>
        <div><Label>Admin override password</Label><Input type="password" value={override} onChange={e=>setOverride(e.target.value)} placeholder="Store-level override password"/></div>
        <div><Label>Reason (min 10 characters)</Label><Input value={reason} onChange={e=>setReason(e.target.value)} placeholder="Describe why this action is being taken"/></div>
        <div className="flex justify-end gap-2 pt-2">
          <Btn variant="outline" onClick={onClose} disabled={busy}>Cancel</Btn>
          <Btn variant="danger" onClick={submit} disabled={busy}>{busy ? 'Verifying…' : confirmLabel}</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------- Setup Wizard ---------------- */
function Setup({ onDone }) {
  const [step, setStep] = useState(1);
  const [tested, setTested] = useState(false);
  const [busy, setBusy] = useState(false);
  const [fbCfg, setFbCfg] = useState({ apiKey:'', authDomain:'', projectId:'', storageBucket:'', messagingSenderId:'', appId:'' });
  const [admin, setAdmin] = useState({ name:'', employeeId:'', email:'', password:'', confirm:'', phone:'', department:'' });
  const [org, setOrg] = useState({ storeName:'Engineering Store', department:'Engineering', currency:'INR' });
  const [override, setOverride] = useState({ pwd:'', confirm:'' });

  async function testConnection() {
    setBusy(true);
    try {
      const app = firebase.apps.find(a => a.name === '__test__') || firebase.initializeApp(fbCfg, '__test__');
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/projects?key=${fbCfg.apiKey}`);
      if (res.status === 401 || res.status === 403) throw new Error('Invalid API key');
      setTested(true);
      toast({ title:'Connection successful', variant:'success' });
    } catch (e) {
      toast({ title:'Connection failed', description: e.message, variant:'error' });
    } finally { setBusy(false); }
  }

  async function finish() {
    if (admin.password !== admin.confirm) return toast({ title:'Admin passwords do not match', variant:'error' });
    if (admin.password.length < 8) return toast({ title:'Password must be at least 8 chars', variant:'error' });
    if (override.pwd !== override.confirm) return toast({ title:'Override passwords do not match', variant:'error' });
    if (override.pwd.length < 6) return toast({ title:'Override password must be at least 6 chars', variant:'error' });
    setBusy(true);
    try {
      if (!firebase.apps.some(a => a.name === '[DEFAULT]')) firebase.initializeApp(fbCfg);
      fb = { auth: firebase.auth(), db: firebase.firestore(), storage: firebase.storage() };
      const cred = await fb.auth.createUserWithEmailAndPassword(admin.email, admin.password);
      await fb.db.collection('users').doc(cred.user.uid).set({
        uid: cred.user.uid, userId: admin.employeeId || cred.user.uid, email: admin.email,
        name: admin.name, role: 'super_admin', department: admin.department, phone: admin.phone,
        status: 'active', createdAt: Date.now()
      });
      const salt = makeSalt();
      const adminOverrideHash = await hashPwd(override.pwd, salt);
      await fb.db.collection('system').doc('config').set({
        org, settings: { allowSelfRegistration: true, requireApproval: true, autoLogoutMinutes: 30 },
        adminOverrideHash, adminOverrideSalt: salt, adminConfigured: true, superAdminUid: cred.user.uid
      });
      await fb.db.collection('system').doc('firebaseConfig').set(fbCfg);
      saveConfigLocal(fbCfg);
      await fb.auth.signOut();
      toast({ title:'Setup complete! Please sign in.', variant:'success' });
      onDone();
    } catch (e) {
      toast({ title:'Setup failed', description: e.message, variant:'error' });
    } finally { setBusy(false); }
  }

  const steps = ['Firebase','Admin','Organization','Override','Launch'];
  return (
    <div className="mesh min-h-screen p-4">
      <div className="max-w-2xl mx-auto py-10">
        <div className="text-center mb-8">

                <div><Label>Confirm</Label><Input type="password" value={admin.confirm} onChange={e=>setAdmin({...admin,confirm:e.target.value})}/></div>

/* ---------------- Login / Register ---------------- */
function Login() {
  const [mode, setMode] = useState('login');
  const [f, setF] = useState({ email:'', password:'', name:'', userId:'', department:'', phone:'', role:'store_keeper' });
  const [busy, setBusy] = useState(false);

  async function submit() {
    setBusy(true);
    try {
      if (mode === 'login') {
        await fb.auth.signInWithEmailAndPassword(f.email, f.password);
      } else {
        const cfg = (await fb.db.collection('system').doc('config').get()).data() || {};
        if (cfg.settings && cfg.settings.allowSelfRegistration === false) throw new Error('Self-registration disabled. Ask admin.');
        const cred = await fb.auth.createUserWithEmailAndPassword(f.email, f.password);
        await fb.db.collection('users').doc(cred.user.uid).set({
          uid: cred.user.uid, userId: f.userId || cred.user.uid, email: f.email, name: f.name,
          role: f.role, department: f.department, phone: f.phone, status: 'pending', createdAt: Date.now()
        });
        toast({ title:'Awaiting admin approval', variant:'success' });
      }
    } catch (e) { toast({ title:'Failed', description: e.message, variant:'error' }); }
    finally { setBusy(false); }
  }
  async function forgot() {
    if (!f.email) return toast({ title:'Enter your email first', variant:'error' });
    try { await fb.auth.sendPasswordResetEmail(f.email); toast({ title:'Reset email sent', variant:'success' }); }
    catch (e) { toast({ title:'Failed', description: e.message, variant:'error' }); }
  }

  return (
    <div className="mesh min-h-screen flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-6">
          <div className="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-indigo-600 mb-3">
            <Icon name="qr" className="h-7 w-7 text-white"/>
          </div>
          <h1 className="text-2xl font-black">StoreSense</h1>
          <p className="text-xs text-slate-400">Engineering Materials Control</p>
        </div>
        <Card>
          <div className="flex gap-1 mb-4 rounded-xl bg-slate-800/60 p-1">
            <button onClick={()=>setMode('login')} className={`flex-1 rounded-lg py-2 text-sm font-medium ${mode==='login'?'bg-indigo-600 text-white':'text-slate-400'}`}>Sign In</button>
            <button onClick={()=>setMode('register')} className={`flex-1 rounded-lg py-2 text-sm font-medium ${mode==='register'?'bg-indigo-600 text-white':'text-slate-400'}`}>Register</button>
          </div>
          <div className="space-y-3">
            {mode === 'register' && (
              <>
                <div><Label>Full name</Label><Input value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></div>
                <div><Label>Employee ID</Label><Input value={f.userId} onChange={e=>setF({...f,userId:e.target.value})}/></div>
              </>
            )}
            <div><Label>Email</Label><Input type="email" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></div>
            <div><Label>Password</Label><Input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
            {mode === 'register' && (
              <>
                <div className="grid grid-cols-2 gap-3">
                  <div><Label>Department</Label><Input value={f.department} onChange={e=>setF({...f,department:e.target.value})}/></div>
                  <div><Label>Phone</Label><Input value={f.phone} onChange={e=>setF({...f,phone:e.target.value})}/></div>
                </div>
                <div><Label>Requested role</Label>
                  <select value={f.role} onChange={e=>setF({...f,role:e.target.value})} className="w-full h-10 rounded-xl bg-slate-900 border border-slate-700 px-3 text-sm">
                    <option value="store_keeper">Store Keeper</option>
                    <option value="viewer">Viewer</option>
                  </select>
                </div>
              </>
            )}
            {mode === 'login' && (
              <div className="flex justify-end"><button onClick={forgot} className="text-xs text-indigo-400 hover:underline">Forgot password?</button></div>
            )}
            <Btn className="w-full" onClick={submit} disabled={busy}>{busy ? 'Please wait…' : mode==='login' ? 'Sign In' : 'Create Account'}</Btn>
            {mode === 'register' && <p className="text-xs text-center text-slate-400">New accounts require admin approval.</p>}
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
function Dashboard({ profile, navigate }) {
  const [mats, setMats] = useState([]);
  const [txns, setTxns] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const u1 = fb.db.collection('materials').where('isDeleted','==',false).onSnapshot(s => {
      setMats(s.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    }, () => setLoading(false));
    const u2 = fb.db.collection('transactions').orderBy('date','desc').limit(20).onSnapshot(s => {
      setTxns(s.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return () => { u1(); u2(); };
  }, []);

  const stats = useMemo(() => {
    const totalValue = mats.reduce((s,m) => s + (m.unitPrice||0) * m.quantity, 0);
    const lowStock = mats.filter(m => m.quantity > 0 && m.quantity <= m.minStock).length;
    const outOfStock = mats.filter(m => m.quantity === 0).length;
    return { total: mats.length, totalValue, lowStock, outOfStock };
  }, [mats]);

  if (loading) return <div className="text-slate-400">Loading dashboard…</div>;

  return (
    <div className="space-y-6">
      <div>
        <p className="text-sm text-slate-400">Welcome back</p>
        <h1 className="text-2xl font-bold">{profile.name}</h1>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {[
          { label:'Materials', value: stats.total, icon:'box', tone:'text-indigo-400' },
          { label:'Stock value', value: fmtMoney(stats.totalValue), icon:'trending', tone:'text-emerald-400' },
          { label:'Low stock', value: stats.lowStock, icon:'alert', tone:'text-amber-400' },
          { label:'Out of stock', value: stats.outOfStock, icon:'x', tone:'text-red-400' }
        ].map(k => (
          <Card key={k.label}>
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs uppercase tracking-wide text-slate-400">{k.label}</p>
                <p className="mt-1 text-xl font-bold">{k.value}</p>
              </div>
              <Icon name={k.icon} className={`h-8 w-8 ${k.tone}`}/>
            </div>
          </Card>
        ))}
      </div>
      <Card>
        <h2 className="font-semibold mb-3">Recent activity</h2>
        {txns.length === 0 ? <p className="text-sm text-slate-400">No activity yet. Add your first material to get started.</p> : (
          <div className="space-y-2">
            {txns.slice(0,8).map(t => (
              <div key={t.id} className="flex items-center justify-between border-b border-slate-800 pb-2 last:border-0 text-sm">
                <div>
                  <span className={`mr-2 rounded px-1.5 py-0.5 text-[10px] font-bold ${t.type==='ISSUE'?'bg-red-500/10 text-red-400':'bg-emerald-500/10 text-emerald-400'}`}>{t.type}</span>
                  <span className="font-medium">{t.materialName}</span>
                  <span className="text-slate-400 ml-1">· {t.qty} {t.uom}</span>
                </div>
                <span className="text-xs text-slate-500">{fmtTime(t.date)}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
      <div className="flex flex-wrap gap-2">
        <Btn onClick={()=>navigate('#/materials')}>Manage materials <Icon name="arrowR" className="h-4 w-4 ml-1"/></Btn>
        <Btn variant="secondary" onClick={()=>navigate('#/transactions')}>View transactions <Icon name="arrowR" className="h-4 w-4 ml-1"/></Btn>
      </div>
    </div>
  );
}

/* ---------------- Materials ---------------- */
function Materials({ profile, navigate }) {
  const [mats, setMats] = useState([]);
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [delTarget, setDelTarget] = useState(null);
  const canEdit = ['admin','super_admin','store_keeper'].includes(profile.role);

  useEffect(() => {
    const unsub = fb.db.collection('materials').where('isDeleted','==',false).onSnapshot(s => {
      setMats(s.docs.map(d => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, []);

  const filtered = mats.filter(m => {
    const txt = `${m.name} ${m.materialId} ${m.partNo||''} ${m.shelf} ${m.rack} ${m.category}`.toLowerCase();
    if (q && !txt.includes(q.toLowerCase())) return false;
    if (filter === 'low' && !(m.quantity > 0 && m.quantity <= m.minStock)) return false;
    if (filter === 'out' && m.quantity !== 0) return false;
    return true;
  });

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <h1 className="text-2xl font-bold">Materials</h1>
        {canEdit && <Btn onClick={()=>navigate('#/materials/new')}><Icon name="plus" className="h-4 w-4 mr-1"/> New Material</Btn>}
      </div>
      <Card>
        <div className="flex flex-wrap gap-2">
          <Input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search name, ID, shelf, rack…" className="flex-1 min-w-[200px]"/>
          <div className="flex gap-1 rounded-xl border border-slate-700 p-1 text-xs">
            {['all','low','out'].map(f => (
              <button key={f} onClick={()=>setFilter(f)} className={`rounded-lg px-3 py-1.5 capitalize ${filter===f?'bg-indigo-600 text-white':'text-slate-400'}`}>{f}</button>
            ))}
          </div>
        </div>
      </Card>
      {filtered.length === 0 ? (
        <Card className="text-center py-10">
          <Icon name="box" className="h-12 w-12 text-slate-600 mx-auto mb-3"/>
          <p className="font-medium">No materials yet</p>
          <p className="text-sm text-slate-400 mt-1">Add your first material to generate a QR code.</p>
        </Card>
      ) : (
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          {filtered.map(m => (
            <Card key={m.id} className="space-y-2">
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <button onClick={()=>navigate(`#/materials/${m.id}`)} className="text-left font-semibold hover:underline truncate block">{m.name}</button>
                  <p className="text-xs font-mono text-slate-500">{m.materialId}</p>
                </div>
                {m.quantity === 0 && <span className="rounded bg-red-500/10 px-1.5 py-0.5 text-[10px] font-bold text-red-400">OUT</span>}
                {m.quantity > 0 && m.quantity <= m.minStock && <span className="rounded bg-amber-500/10 px-1.5 py-0.5 text-[10px] font-bold text-amber-400">LOW</span>}
              </div>
              <p className="text-sm"><span className="font-bold">{m.quantity} {m.uom}</span> <span className="text-slate-400 ml-2">· {m.shelf}/{m.rack}</span></p>
              <p className="text-xs text-slate-400">{m.category} · {fmtMoney(m.unitPrice * m.quantity)}</p>
              <div className="flex gap-2 pt-1">
                <Btn size="sm" variant="outline" className="flex-1" onClick={()=>navigate(`#/scan/${m.id}`)}><Icon name="scan" className="h-3 w-3 mr-1"/>Scan</Btn>
                {canEdit && <Btn size="sm" variant="ghost" onClick={()=>setDelTarget(m)}><Icon name="trash" className="h-4 w-4 text-red-400"/></Btn>}
              </div>
            </Card>
          ))}
        </div>
      )}
      <PasswordGate
        open={!!delTarget}
        onClose={()=>setDelTarget(null)}
        title="Delete material"
        confirmLabel="Delete"
        onConfirm={async (reason)=>{
          await softDeleteMaterial({ materialId: delTarget.id, reason, actor: { uid: profile.uid, name: profile.name } });
          toast({ title:'Moved to recycle bin', variant:'success' });
        }}
      />
    </div>
  );
}

/* ---------------- Material Form ---------------- */
function MaterialForm({ profile, navigate, editId }) {
  const [f, setF] = useState({ name:'', category:'', partNo:'', uom:'Nos', shelf:'', rack:'', quantity:0, minStock:5, maxStock:100, unitPrice:0, supplier:'', description:'' });
  const [qr, setQr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [imageFile, setImageFile] = useState(null);
  const [imageUrl, setImageUrl] = useState('');
  const [savedMaterialId, setSavedMaterialId] = useState('');

  useEffect(() => {
    if (!editId) return;
    fb.db.collection('materials').doc(editId).get().then(s => {
      if (s.exists) {
        const d = s.data();
        setF({ ...d, quantity: d.quantity||0, minStock: d.minStock||0, maxStock: d.maxStock||0, unitPrice: d.unitPrice||0 });
        setQr(d.qrPayload); setImageUrl(d.imageUrl||''); setSavedMaterialId(d.materialId||'');
      }
    });
  }, [editId]);

  async function save() {
    if (!f.name || !f.category || !f.shelf || !f.rack) return toast({ title:'Name, category, shelf, rack required', variant:'error' });
    setBusy(true);
    try {
      const materialId = f.materialId || `MAT-ENG-${Date.now().toString().slice(-6)}`;
      const qrPayload = f.qrPayload || await buildQrPayload(materialId);
      const qrImageUrl = await QRCode.toDataURL(qrPayload, { width: 320, margin: 1 });

      let finalImageUrl = imageUrl;
      if (imageFile) {
        try {
          const storageRef = fb.storage.ref(`materials/${materialId}/${Date.now()}`);
          const snap = await storageRef.put(imageFile);
          finalImageUrl = await snap.ref.getDownloadURL();
        } catch (e) {
          toast({ title:'Image upload failed — saving without image', description: e.message, variant:'error' });
        }
      }

      const docId = editId || materialId;
      const payload = {
        materialId, name: f.name, category: f.category, partNo: f.partNo, uom: f.uom,
        shelf: f.shelf, rack: f.rack, quantity: Number(f.quantity), minStock: Number(f.minStock),
        maxStock: Number(f.maxStock), unitPrice: Number(f.unitPrice), supplier: f.supplier,
        description: f.description, imageUrl: finalImageUrl, qrPayload, qrImageUrl,
        status: Number(f.quantity) === 0 ? 'out_of_stock' : (Number(f.quantity) <= Number(f.minStock) ? 'low_stock' : 'active'),
        isDeleted: false, createdBy: f.createdBy || profile.uid, createdAt: f.createdAt || Date.now(),
        updatedBy: profile.uid, updatedAt: Date.now()
      };
      await fb.db.collection('materials').doc(docId).set(payload, { merge: true });
      setQr(qrPayload); setSavedMaterialId(materialId);
      toast({ title: editId ? 'Material updated' : 'Material created with QR', variant:'success' });
      if (!editId) navigate(`#/materials/${docId}`);
    } catch (e) {
      toast({ title:'Save failed', description: e.message, variant:'error' });
    } finally { setBusy(false); }
  }

  function downloadQr() {
    if (!qr) return;
    QRCode.toDataURL(qr, { width: 512, margin: 1 }).then(url => {
      const a = document.createElement('a');
      a.href = url; a.download = `${savedMaterialId || f.materialId || 'material'}-qr.png`; a.click();
    });
  }

  return (
    <div className="max-w-3xl mx-auto space-y-4">
      <h1 className="text-2xl font-bold">{editId ? 'Edit material' : 'New material'}</h1>
      <Card className="space-y-3">
        <div className="grid gap-3 md:grid-cols-2">
          <div><Label>Name *</Label><Input value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></div>
          <div><Label>Category *</Label><Input value={f.category} onChange={e=>setF({...f,category:e.target.value})} placeholder="e.g. Bearings, Tools"/></div>
          <div><Label>Shelf *</Label><Input value={f.shelf} onChange={e=>setF({...f,shelf:e.target.value})} placeholder="e.g. A1"/></div>
          <div><Label>Rack *</Label><Input value={f.rack} onChange={e=>setF({...f,rack:e.target.value})} placeholder="e.g. R-03"/></div>
          <div><Label>Part No</Label><Input value={f.partNo} onChange={e=>setF({...f,partNo:e.target.value})}/></div>
          <div><Label>UOM</Label>
            <select value={f.uom} onChange={e=>setF({...f,uom:e.target.value})} className="w-full h-10 rounded-xl bg-slate-900 border border-slate-700 px-3 text-sm">
              {['Nos','Kg','Mtr','Ltr','Box','Set','Pack'].map(u => <option key={u}>{u}</option>)}
            </select>
          </div>
          <div><Label>Quantity</Label><Input type="number" value={f.quantity} onChange={e=>setF({...f,quantity:e.target.value})}/></div>
          <div><Label>Min Stock</Label><Input type="number" value={f.minStock} onChange={e=>setF({...f,minStock:e.target.value})}/></div>
          <div><Label>Max Stock</Label><Input type="number" value={f.maxStock} onChange={e=>setF({...f,maxStock:e.target.value})}/></div>
          <div><Label>Unit Price</Label><Input type="number" step="0.01" value={f.unitPrice} onChange={e=>setF({...f,unitPrice:e.target.value})}/></div>
          <div><Label>Supplier</Label><Input value={f.supplier} onChange={e=>setF({...f,supplier:e.target.value})}/></div>
          <div><Label>Image</Label><Input type="file" accept="image/*" onChange={e=>setImageFile(e.target.files ? e.target.files[0] : null)}/></div>
        </div>
        <div><Label>Description</Label><Input value={f.description} onChange={e=>setF({...f,description:e.target.value})}/></div>
        {imageUrl && <img src={imageUrl} className="h-32 rounded-lg" alt="preview"/>}
        <div className="flex gap-2">

/* ---------------- QR Display ---------------- */
function QrDisplay({ payload, size = 192 }) {
  const [dataUrl, setDataUrl] = useState('');
  useEffect(() => {
    QRCode.toDataURL(payload, { width: 400, margin: 1, color: { dark:'#0f172a', light:'#ffffff' } }).then(setDataUrl);
  }, [payload]);
  return (
    <div className="flex flex-col items-center gap-2">

        ? <img src={dataUrl} alt="QR" className="rounded-lg bg-white p-2" style={{width:size, height:size}}/>
        : <div className="bg-slate-800 rounded-lg animate-pulse" style={{width:size, height:size}}/>}
      <p className="text-[10px] font-mono text-slate-500 break-all text-center">{payload}</p>

/* ---------------- QR Scanner Modal ---------------- */
function QrScanner({ open, onClose, onScanned }) {
  const [error, setError] = useState(null);
  const [manual, setManual] = useState('');
  const scannerRef = useRef(null);
  const lastScan = useRef({ payload:'', at: 0 });

  useEffect(() => {
    if (!open) return;
    let cancelled = false;
    async function start() {
      try {
        const scanner = new Html5Qrcode('ss-scanner');
        scannerRef.current = scanner;
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 240, height: 240 } },
          (decoded) => {
            const now = Date.now();
            if (lastScan.current.payload === decoded && now - lastScan.current.at < 1500) return;
            lastScan.current = { payload: decoded, at: now };
            onScanned(decoded); onClose();
          },
          () => {}
        );
      } catch (e) {
        if (!cancelled) setError(e.message || 'Camera unavailable');
      }
    }
    start();
    return () => {
      cancelled = true;
      if (scannerRef.current) scannerRef.current.stop().catch(() => {});
    };
  }, [open, onClose, onScanned]);

  if (!open) return null;
  return (
    <Modal onClose={onClose} title="Scan QR Code" wide>
      <div id="ss-scanner" className="w-full rounded-xl overflow-hidden bg-black min-h-[240px]"/>
      {error && <div className="mt-3 rounded-xl bg-amber-500/10 border border-amber-500/40 p-3 text-sm text-amber-400">Camera unavailable: {error}. Use manual entry below.</div>}
      <div className="mt-3">
        <Label>Manual entry</Label>
        <div className="flex gap-2">
          <Input value={manual} onChange={e=>setManual(e.target.value)} placeholder="Paste QR payload (MAT-…)"/>
          <Btn onClick={()=>{ if (manual.trim()) { onScanned(manual.trim()); onClose(); } }}>Go</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------- App Shell ---------------- */
function AppShell({ profile, route, navigate }) {
  const [scanOpen, setScanOpen] = useState(false);
  const [mobileNav, setMobileNav] = useState(false);

  const links = [
    { href:'#/', label:'Dashboard', icon:'home' },
    { href:'#/materials', label:'Materials', icon:'box' },
    { href:'#/transactions', label:'Transactions', icon:'trending' },
    { href:'#/admin/users', label:'Users', icon:'users', roles:['admin','super_admin'] },
    { href:'#/admin/settings', label:'Settings', icon:'settings', roles:['admin','super_admin'] }
  ].filter(l => !l.roles || l.roles.includes(profile.role));

  async function handleScan(payload) {
    const id = await verifyQrPayload(payload);
    if (!id) return toast({ title:'Unknown QR code', variant:'error' });
    const snap = await fb.db.collection('materials').doc(id).get();
    if (!snap.exists) return toast({ title:'Material not found', variant:'error' });
    navigate(`#/scan/${id}`);
  }

  let content;
  if (route === '#/' || route === '' || route === '#') content = <Dashboard profile={profile} navigate={navigate}/>;
  else if (route === '#/materials') content = <Materials profile={profile} navigate={navigate}/>;
  else if (route === '#/materials/new') content = <MaterialForm profile={profile} navigate={navigate}/>;
  else if (route.startsWith('#/materials/') && route.endsWith('/edit')) content = <MaterialDetail profile={profile} navigate={navigate} materialId={route.split('/')[2]} edit/>;
  else if (route.startsWith('#/materials/')) content = <MaterialDetail profile={profile} navigate={navigate} materialId={route.split('/')[2]}/>;
  else if (route.startsWith('#/scan/')) content = <ScanPage profile={profile} navigate={navigate} materialId={route.split('/')[2]}/>;
  else if (route === '#/transactions') content = <Transactions profile={profile}/>;
  else if (route === '#/admin/users' && ['admin','super_admin'].includes(profile.role)) content = <UsersPage profile={profile}/>;
  else if (route === '#/admin/settings' && ['admin','super_admin'].includes(profile.role)) content = <SettingsPage profile={profile}/>;
  else content = <div className="text-center py-20"><p className="text-slate-400">Page not found</p><Btn className="mt-3" onClick={()=>navigate('#/')}>Go home</Btn></div>;

  return (
    <div className="min-h-screen flex">
      <aside className={`${mobileNav ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 fixed md:static inset-y-0 left-0 z-30 w-64 bg-slate-900 border-r border-slate-800 p-4 flex flex-col transition-transform`}>
        <div className="flex items-center gap-2 mb-6">
          <div className="rounded-xl bg-indigo-600 p-2"><Icon name="qr" className="h-5 w-5 text-white"/></div>
          <div>
            <p className="text-sm font-bold">StoreSense</p>
            <p className="text-[10px] uppercase tracking-widest text-slate-500">Materials Control</p>
          </div>
        </div>
        <nav className="flex-1 space-y-1">
          {links.map(l => (
            <a key={l.href} href={l.href} onClick={()=>setMobileNav(false)} className={`flex items-center gap-2 rounded-xl px-3 py-2 text-sm ${route===l.href ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100'}`}>
              <Icon name={l.icon} className="h-4 w-4"/>{l.label}
            </a>
          ))}
        </nav>
        <div className="mt-4 rounded-xl border border-slate-800 p-3">
          <p className="truncate text-sm font-medium">{profile.name}</p>
          <p className="text-xs capitalize text-slate-500">{(profile.role || '').replace('_',' ')}</p>
          <Btn size="sm" variant="ghost" className="mt-2 w-full" onClick={()=>fb.auth.signOut()}>
            <Icon name="logout" className="h-4 w-4 mr-1"/>Sign out
          </Btn>
        </div>
      </aside>

      {mobileNav && <div className="md:hidden fixed inset-0 z-20 bg-black/50" onClick={()=>setMobileNav(false)}/>}

      <main className="flex-1 min-w-0">
        <div className="md:hidden flex items-center justify-between p-3 border-b border-slate-800 bg-slate-900/60">
          <button onClick={()=>setMobileNav(true)}><Icon name="menu" className="h-6 w-6"/></button>
          <p className="font-bold">StoreSense</p>
          <div className="w-6"/>
        </div>
        <div className="p-4 md:p-6">{content}</div>
      </main>

      <button onClick={()=>setScanOpen(true)} className="fixed bottom-5 right-5 z-40 rounded-full bg-indigo-600 p-4 text-white shadow-lg hover:scale-105 active:scale-95 transition">
        <Icon name="scan" className="h-6 w-6"/>
      </button>

      <QrScanner open={scanOpen} onClose={()=>setScanOpen(false)} onScanned={handleScan}/>
    </div>
  );
}

/* ---------------- App Root ---------------- */
function App() {
  const [route, setRoute] = useState(window.location.hash || '#/');
  const [configReady, setConfigReady] = useState(() => !!loadSavedConfig());
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const toasts = useToasts();

  useEffect(() => {
    const onHash = () => setRoute(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = useCallback((to) => {
    if (window.location.hash === to) return;
    window.location.hash = to;
  }, []);

  useEffect(() => {
    if (!configReady) { setLoading(false); return; }
    const cfg = loadSavedConfig();
    if (!cfg) { setLoading(false); return; }
    try { initFirebase(cfg); } catch (e) { console.error(e); setLoading(false); return; }
    const unsub = fb.auth.onAuthStateChanged(async (u) => {
      if (!u) { setProfile(null); setLoading(false); return; }
      try {
        const snap = await fb.db.collection('users').doc(u.uid).get();
        setProfile(snap.exists ? { uid: u.uid, ...snap.data() } : { uid: u.uid, email: u.email, name: u.email, role: 'viewer', status: 'pending' });
      } catch {
        setProfile({ uid: u.uid, email: u.email, name: u.email, role: 'viewer', status: 'pending' });
      }
      setLoading(false);
    });
    return unsub;
  }, [configReady]);

  if (!configReady) return <><Setup onDone={()=>setConfigReady(true)}/><Toaster toasts={toasts}/></>;
  if (loading) return <div className="mesh min-h-screen flex items-center justify-center text-slate-400">Loading…</div>;
  if (!profile) return <><Login/><Toaster toasts={toasts}/></>;
  if (profile.status && profile.status !== 'active') return <><Pending profile={profile}/><Toaster toasts={toasts}/></>;

  return <><AppShell profile={profile} route={route} navigate={navigate}/><Toaster toasts={toasts}/></>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
